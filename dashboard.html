<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — i3z voice</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="dash-body">

<div id="gate" class="gate">
  <div class="gate-card">
    <div class="gate-logo">i3z</div>
    <h1>لوحة تحكم i3z voice</h1>
    <p>سجّل دخولك لإدارة أكواد VIP وإعدادات الموقع</p>
    <button id="gate-login-btn" class="btn-grad">تسجيل الدخول</button>
    <a href="index.html" class="gate-back">← العودة للموقع</a>
  </div>
</div>

<div id="app" class="dash-app hidden">
  <aside class="dash-sidebar">
    <div class="dash-brand">
      <div class="dash-avatar">i3z</div>
      <div>
        <strong>i3z voice</strong>
        <span>لوحة التحكم</span>
      </div>
    </div>
    <nav class="dash-nav">
      <a href="#overview" class="dash-nav-link active" data-target="overview">📊 نظرة عامة</a>
      <a href="#codes" class="dash-nav-link" data-target="codes">👑 أكواد VIP</a>
      <a href="#settings" class="dash-nav-link" data-target="settings">⚙️ إعدادات الموقع</a>
    </nav>
    <div class="dash-sidebar-footer">
      <a href="index.html" target="_blank" class="dash-ghost-btn">معاينة الموقع</a>
      <button id="logout-btn" class="dash-ghost-btn danger">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h2 id="topbar-title">نظرة عامة</h2>
        <p id="topbar-sub">مرحباً بك من جديد</p>
      </div>
      <div id="save-status" class="save-status"></div>
    </header>

    <div id="loading" class="dash-loading">جاري تحميل البيانات...</div>

    <section id="section-overview" class="dash-section">
      <div class="stats-grid" id="stats-grid"></div>
      <div class="panel">
        <div class="panel-head">
          <h3>آخر أكواد VIP</h3>
          <button class="btn-grad small" data-nav="codes">+ كود جديد</button>
        </div>
        <div id="recent-codes-list" class="recent-list"></div>
      </div>
    </section>

    <section id="section-codes" class="dash-section hidden">
      <div class="panel-head">
        <h3>إدارة أكواد VIP</h3>
        <button id="add-code-btn" class="btn-grad small">+ كود جديد</button>
      </div>
      <div id="codes-editor-list"></div>
      <button id="save-codes-btn" class="btn-grad btn-full" style="margin-top:16px;">💾 حفظ كل التغييرات</button>
    </section>

    <section id="section-settings" class="dash-section hidden">
      <div class="panel">
        <h3>إعدادات الموقع</h3>
        <div class="form-grid" id="settings-form"></div>
      </div>
      <button id="save-settings-btn" class="btn-grad">💾 حفظ الإعدادات</button>
    </section>
  </main>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
